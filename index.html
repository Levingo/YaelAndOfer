<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yael &amp; Ofer</title>
  <meta name="description" content="Ofer Löwinger & Yael Gat – Live music duo based in Berlin. Israeli folk, klezmer, Jewish classics and original songs." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ===== NAV ===== -->
  <nav id="main-nav">
    <span id="nav-logo">Yael &amp; Ofer</span>

    <button id="nav-toggle" aria-label="Toggle menu" onclick="document.getElementById('nav-links').classList.toggle('open')">
      <span></span><span></span><span></span>
    </button>

    <ul id="nav-links">
      <li><a href="#repertoire" data-i18n="nav.repertoire"></a></li>
      <li><a href="#about"      data-i18n="nav.about"></a></li>
      <li><a href="#contact"    data-i18n="nav.contact"></a></li>
    </ul>

    <div id="lang-toggle">
      <button class="lang-btn active" onclick="setLang('en')">EN</button>
      <button class="lang-btn"        onclick="setLang('de')">DE</button>
    </div>
  </nav>

  <!-- ===== HERO ===== -->
  <section id="hero">
    <div id="hero-image-wrap">
      <!-- src is filled by JS from content.json -->
      <img id="hero-img" src="" alt="" />
    </div>
    <div id="hero-content">
      <h1 id="hero-title">Yael<br><em>&amp; Ofer</em></h1>
      <p id="hero-subtitle" data-i18n="site.subtitle"></p>
      <a id="hero-cta" href="#contact" data-i18n="nav.contact"></a>
    </div>
  </section>

  <!-- ===== REPERTOIRE ===== -->
  <section id="repertoire" class="section">
    <div class="section-inner">
      <h2 class="section-heading" data-i18n="repertoire.heading"></h2>
      <div class="section-rule"></div>
      <div id="videos-grid">
        <!-- injected by JS -->
      </div>
    </div>
  </section>

  <!-- ===== ABOUT ===== -->
  <section id="about" class="section">
    <div class="section-inner">
      <h2 class="section-heading" data-i18n="about.heading"></h2>
      <div class="section-rule"></div>
      <p id="about-text" data-i18n="about.text"></p>
    </div>
  </section>

  <!-- ===== CONTACT ===== -->
  <section id="contact" class="section">
    <div class="section-inner">
      <h2 class="section-heading" data-i18n="contact.heading"></h2>
      <div class="section-rule"></div>
      <p id="contact-tagline" data-i18n="contact.tagline"></p>
      <div id="contact-card">
        <div id="contact-name"></div>

        <div class="contact-row">
          <!-- phone icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.6 3.38 2 2 0 0 1 3.56 1.2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.74a16 16 0 0 0 5.65 5.65l.95-.95a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 21.2 16z"/></svg>
          <a id="contact-phone" href=""></a>
        </div>

        <div class="contact-row">
          <!-- email icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <a id="contact-email" href=""></a>
        </div>

        <div class="contact-row">
          <!-- instagram icon -->
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
          <a id="contact-instagram" href="" target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== FOOTER ===== -->
  <footer id="footer">
    <span data-i18n="footer.text"></span>
  </footer>

  <!-- ===== SCRIPT ===== -->
  <script src="content.js"></script>
  <script>
    let LANG = 'en';

    // ----- resolve nested key like "nav.about" -----
    function get(obj, path) {
      return path.split('.').reduce((o, k) => (o && o[k] !== undefined ? o[k] : null), obj);
    }

    // ----- get localised string -----
    function t(path) {
      const node = get(CONTENT, path);
      if (!node) return '';
      if (typeof node === 'string') return node;
      return node[LANG] || node['en'] || '';
    }

    // ----- render videos grid -----
    function renderVideos() {
      const grid = document.getElementById('videos-grid');
      grid.innerHTML = '';
      CONTENT.repertoire.videos.forEach(v => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <div class="video-embed-wrap">
            <iframe
              src="https://www.youtube.com/embed/${v.youtube_id}"
              title="${v.title[LANG] || v.title['en']}"
              allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
              allowfullscreen
              loading="lazy">
            </iframe>
          </div>
          <div class="video-title">${v.title[LANG] || v.title['en']}</div>
        `;
        grid.appendChild(card);
      });
    }

    // ----- apply all i18n data-i18n attributes -----
    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
    }

    // ----- render contact block -----
    function renderContact() {
      const c = CONTENT.contact;
      document.getElementById('contact-name').textContent = c.name;

      const phone = document.getElementById('contact-phone');
      phone.href = 'tel:' + c.phone.replace(/\s/g, '');
      phone.textContent = c.phone;

      const email = document.getElementById('contact-email');
      email.href = 'mailto:' + c.email;
      email.textContent = c.email;

      const ig = document.getElementById('contact-instagram');
      ig.href = c.instagram_url;
      ig.textContent = '@' + c.instagram;
    }

    // ----- full render pass -----
    function render() {
      applyI18n();
      renderVideos();
      renderContact();

      // hero image
      const img = document.getElementById('hero-img');
      img.src = CONTENT.site.image;
      img.alt = t('site.image_alt');

      // lang buttons
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toLowerCase() === LANG);
      });

      // html lang attribute
      document.documentElement.lang = LANG;

      // document title
      document.title = CONTENT.site.title;
    }

    // ----- switch language -----
    function setLang(lang) {
      LANG = lang;
      render();
      // close mobile menu if open
      document.getElementById('nav-links').classList.remove('open');
    }

    // ----- smooth-close mobile nav on link click -----
    document.querySelectorAll('#nav-links a').forEach(a => {
      a.addEventListener('click', () => {
        document.getElementById('nav-links').classList.remove('open');
      });
    });

    // CONTENT is loaded from content.js (declared as a const above)
    render();
  </script>
</body>
</html>
